    ctx.restore(); }
  // butterflies
  G.butterflies.forEach(b=>{ b.t+=0.016; const bx=b.x+Math.sin(b.t*1.3)*46, by=b.y+Math.cos(b.t*.9)*30;
    if(!inView(bx,by,30))return; ctx.save(); ctx.translate(bx,by);
    ctx.fillStyle=b.c; const f=Math.abs(Math.sin(b.t*10))*4+2;
    ctx.beginPath(); ctx.ellipse(-f*.6,0,f,3,-.5,0,7); ctx.ellipse(f*.6,0,f,3,.5,0,7); ctx.fill();
    ctx.fillStyle='#4A3222'; ctx.fillRect(-1,-3,2,6); ctx.restore(); });
  // clouds (shadows + puffs)
  G.clouds.forEach(c2=>{ c2.x+=c2.v*.016; if(c2.x>MAP_W*TILE+200)c2.x=-200;
    if(!inView(c2.x,c2.y,260))return;
    ctx.fillStyle='rgba(40,60,40,.07)'; ctx.beginPath();
    ctx.ellipse(c2.x,c2.y+30,70*c2.s,26*c2.s,0,0,7); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.5)';
    ctx.beginPath(); ctx.ellipse(c2.x,c2.y-90,60*c2.s,22*c2.s,0,0,7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(c2.x+34*c2.s,c2.y-80,36*c2.s,16*c2.s,0,0,7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(c2.x-36*c2.s,c2.y-82,32*c2.s,14*c2.s,0,0,7); ctx.fill(); });
  // the buried Starlight Net — a faint glimmer, only up close
  if(G.areas.crags&&!G.hasNet){ const nx=NET_SPOT.x*TILE+18,ny=NET_SPOT.y*TILE+18;
    if(inView(nx,ny,80)&&dist2(nx,ny,G.player.x,G.player.y)<170*170){
      ctx.fillStyle='#8C5A40'; ctx.beginPath(); ctx.ellipse(nx,ny+6,12,6,0,0,7); ctx.fill();
      ctx.fillStyle='#A9793F'; ctx.beginPath(); ctx.ellipse(nx,ny+3,9,5,0,0,7); ctx.fill();
      const gl=.5+.5*Math.sin(t*5);
      ctx.fillStyle='rgba(255,233,160,'+gl+')'; star2(ctx,nx,ny-4,4+gl*2); } }
  // thrown net arc
  if(G.netThrow){ const n=G.netThrow, p=Math.min(1,n.t/.42);
    const x=lerp(n.x0,n.x1,p), y=lerp(n.y0,n.y1,p)-Math.sin(p*Math.PI)*46;
    ctx.save(); ctx.translate(x,y); ctx.rotate(p*9);
    ctx.strokeStyle='#C99A5F'; ctx.lineWidth=2.5; ctx.beginPath(); ctx.arc(0,0,8,0,7); ctx.stroke();
    ctx.strokeStyle='rgba(255,246,206,.8)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(-8,0); ctx.lineTo(8,0); ctx.moveTo(0,-8); ctx.lineTo(0,8); ctx.stroke();
    ctx.strokeStyle='#8C5A2F'; ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(8,0); ctx.lineTo(16,6); ctx.stroke();
    ctx.restore(); }
  // ambient biome motes — drifting leaves, embers, snow, spores, pollen
  G.motes.forEach(m=>{ const a=Math.sin(m.t*2+m.ph);
    const fade=Math.min(1,m.t/.5)*Math.min(1,(m.life-m.t)/.8);
    ctx.globalAlpha=.55*fade;
    if(m.type==='snow'){ ctx.fillStyle='#FFFFFF'; dot(ctx,m.x+a*6,m.y+m.t*22,2.2); }
    else if(m.type==='ember'){ ctx.fillStyle='#FF8A4A'; dot(ctx,m.x+a*5,m.y-m.t*26,2); }
    else if(m.type==='spore'){ ctx.fillStyle='#B89AE0'; dot(ctx,m.x+a*8,m.y-m.t*10,2.2); }
    else if(m.type==='pollen'){ ctx.fillStyle='#FFE9A0'; dot(ctx,m.x+a*7,m.y-m.t*8,1.8); }
    else { ctx.fillStyle='#8FD07A'; ctx.save(); ctx.translate(m.x+a*10,m.y-m.t*6); ctx.rotate(a);
      ctx.beginPath(); ctx.ellipse(0,0,3,1.6,0,0,7); ctx.fill(); ctx.restore(); }
    ctx.globalAlpha=1; });
  // particles
  G.particles.forEach(p=>{ ctx.save(); ctx.translate(p.x,p.y); ctx.globalAlpha=clamp(p.life/p.max,0,1);
    if(p.kind==='heart'){ ctx.fillStyle=p.col; const s=p.sz*.5;
      ctx.beginPath(); ctx.arc(-s,-s*.6,s,0,7); ctx.arc(s,-s*.6,s,0,7); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-s*1.9,-s*.2); ctx.lineTo(0,s*1.6); ctx.lineTo(s*1.9,-s*.2); ctx.closePath(); ctx.fill(); }
    else if(p.kind==='leaf'){ ctx.fillStyle=p.col; ctx.rotate(p.rot+p.life*4); ctx.beginPath(); ctx.ellipse(0,0,p.sz,p.sz*.5,0,0,7); ctx.fill(); }
    else { ctx.fillStyle=p.col; ctx.rotate(p.rot); star(ctx,p.sz); }
    ctx.restore(); });
  ctx.restore();
  // day tint + night fireflies (day computed at top of render)
  if(day<.55){ ctx.fillStyle='rgba(40,36,90,'+((.55-day)*.4)+')'; ctx.fillRect(0,0,VW,VH);
    if(G.settings.particles){ ctx.fillStyle='rgba(255,240,150,.8)';
      for(let i=0;i<8;i++){ const fx=((i*977+G.time*22)%(VW)), fy=VH*.3+Math.sin(G.time*1.4+i*2)*VH*.22+((i*211)%200);
        ctx.globalAlpha=.4+.4*Math.sin(G.time*3+i); ctx.beginPath(); ctx.arc(fx,fy,2,0,7); ctx.fill(); } ctx.globalAlpha=1; } }
  else if(day>.9){ ctx.fillStyle='rgba(255,240,190,'+((day-.9)*.15)+')'; ctx.fillRect(0,0,VW,VH); }
  // warm sun glow by day
  if(day>.45){ const sx=VW*.16, sy=VH*.13;
    const gr=ctx.createRadialGradient(sx,sy,8,sx,sy,Math.max(VW,VH)*.55);
    gr.addColorStop(0,'rgba(255,236,170,'+(0.15*day)+')'); gr.addColorStop(1,'rgba(255,236,170,0)');
    ctx.fillStyle=gr; ctx.fillRect(0,0,VW,VH); }
  // soft vignette to focus the eye
  const vg=ctx.createRadialGradient(VW/2,VH/2,Math.min(VW,VH)*.42,VW/2,VH/2,Math.max(VW,VH)*.78);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(24,16,8,.2)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,VW,VH);
}

/* ---------- main loop ---------- */
let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  try{ stepFrame(now); }
  catch(err){ // never let one bad frame freeze the grove — report and keep running
    console.error('frame error:',err);
    if(!loop._et||now-loop._et>6000){ loop._et=now;
      try{ toast('Game hiccup: '+err.message,'warn',7000); }catch(e2){} } }
}
function stepFrame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now; G.time+=dt; G.dayT+=dt/140;
  if(G.started){
    updatePlayer(dt);
    spawnEggs(dt); updateNodes(dt); updateWildPips(dt); updateInc(dt); updatePips(dt); updateReqs(dt); updateTraps();
    updateFarm(dt); updateNPCs(dt);
    G.storyT=(G.storyT||0)+dt; if(G.storyT>1.5){ G.storyT=0; checkStory(); }
    if(G.boat){ const btx=(G.fishing&&G.fishing.deep)?DEEP.x*TILE+18:DOCK.x*TILE+18;
      const bty=(G.fishing&&G.fishing.deep)?DEEP.y*TILE+18:DOCK.y*TILE+20;
      G.boatX=lerp(G.boatX,btx,1-Math.pow(.015,dt)); G.boatY=lerp(G.boatY,bty,1-Math.pow(.015,dt)); }
    if(G.fishing){ G.fishing.t+=dt;
      if(!G.fishing.deep&&dist2(G.player.x,G.player.y,G.fishing.x,G.fishing.y)>115*115){
        const fx=G.fishing.x,fy=G.fishing.y; G.fishing=null;
        toast('The line went slack — you wandered too far from the spot.','warn');
        particles(fx,fy,'leaf',5,'#4FC3E8'); } }
    if(G.fusionCd>0)G.fusionCd=Math.max(0,G.fusionCd-dt);
    G.interact=findInteract();
    // one-time hint when the keeper first approaches a locked toll gate
    if(!G.stats.gateHint){ for(const k in World.gates){ const g2=World.gates[k];
      if(!G.areas[k]&&dist2(G.player.x,G.player.y,g2.x*TILE+18,g2.y*TILE+18)<130*130){
        G.stats.gateHint=1;
        toast('A toll gate! Read its hanging sign, then stand close and tap UNLOCK — or open new lands from the Map.','good',5600);
        break; } } }
    const ab=$('actBtn');
    if(G.interact){ ab.classList.remove('hide');
      const sub=G.interact.sub?'<span style="display:block;font-size:10.5px;font-weight:600;opacity:.75">'+G.interact.sub+'</span>':'';
      const label=G.interact.label+sub;
      if(ab._lbl!==label){ab.innerHTML=label+(matchMedia('(pointer:coarse)').matches?'':'<span style="display:block;font-size:9.5px;opacity:.6">E</span>');ab._lbl=label;} }
    else ab.classList.add('hide');
    // particles physics
    G.particles=G.particles.filter(p=>{ p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=140*dt; return p.life>0; });
    // ambient biome motes
    if(G.motes.length<70&&chance(.5)){ const x=G.cam.x+rand(0,VW), y=G.cam.y+rand(0,VH);
      const b=World.biomeAt(x,y);
      if(b!=='pond')G.motes.push({x,y,type:b==='crags'?'ember':b==='frost'?'snow':b==='gloom'?'spore':b==='ranch'?'pollen':'leaf',t:0,life:rand(3,5),ph:rand(0,6)}); }
    G.motes=G.motes.filter(m=>{ m.t+=dt; return m.t<m.life; });
    if(G.netThrow){ G.netThrow.t+=dt; if(G.netThrow.t>.5)G.netThrow=null; }
    if(!G.netHint&&G.areas.crags){ G.netHint=1;
      setTimeout(()=>toast('Rumor: something starlit lies buried in the far corners of the Crags...','good',6000),1200); }
    // tutorial nudges
    if(G.tutorial===0&&G.stats.gathered>=3){G.tutorial=1; toast('The egg at the Incubator is nearly ready — go stand beside it!','good',5000);}
    if(G.tutorial===1&&G.stats.hatched>=1){G.tutorial=2; setTimeout(()=>toast('Open PIPS below, tap your new Pip and Feed it its favourite snack.','good',5600),1400);}
    if(G.tutorial===2&&G.stats.feeds>=2){G.tutorial=3; setTimeout(()=>toast('A wanderer may be waiting at the WANDERER POST — match them a Pip for coins!','good',5600),1200);}
    // autosave
    G.saveT+=dt; if(G.saveT>6){ G.saveT=0; SaveSys.store(G); }
    if(G.kbuff&&Date.now()>=G.kbuff.until){ G.kbuff=null; }
    G._hudT=(G._hudT||0)+dt; if(G._hudT>.5){ G._hudT=0; UI.hud(); }
    UI.badges();
  } else {
    // attract mode: gentle camera drift over the meadow
    G.cam.x=(MAP_W*TILE-VW)/2+Math.sin(G.time*.07)*Math.min(220,(MAP_W*TILE-VW)/2-40);
    G.cam.y=(MAP_H*TILE-VH)/2+Math.cos(G.time*.05)*Math.min(140,(MAP_H*TILE-VH)/2-40);
    updateWildPips(dt);
    G.particles=G.particles.filter(p=>{ p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=140*dt; return p.life>0; });
  }
  render(G.time);
}

      '<div style="display:flex;gap:8px;flex-wrap:wrap">'+
        '<button class="btn ghost" data-act="devcmd" data-c="coins">+500 coins</button>'+
        '<button class="btn ghost" data-act="devcmd" data-c="snacks">Snacks +10</button>'+
        '<button class="btn ghost" data-act="devcmd" data-c="shards">+5 shards</button>'+
        '<button class="btn ghost" data-act="devcmd" data-c="areas">All areas</button>'+
        '<button class="btn ghost" data-act="devcmd" data-c="dex">Full Pipdex</button>'+
        '<button class="btn ghost" data-act="devcmd" data-c="quest">Finish quest</button>'+
        '<button class="btn ghost" data-act="devcmd" data-c="chapter">Finish chapter</button></div>'+
      '<div style="margin-top:16px"><button class="btn danger" data-act="devrestore">Restore Normal Save</button></div>'+
      '<div class="hint">Autosave pauses while a test state is active; the save on disk is untouched. Restoring returns to the grove exactly as it was when testing began.</div>'+
      '</div>';
     document.body.appendChild(bg); document.body.appendChild(p);
     document.getElementById('devCode').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); DevSys.enterCode(e.target.value); } e.stopPropagation(); });
   }
   document.getElementById('devBg').classList.add('open');
   document.getElementById('devPanel').classList.add('open');
   this.status(); setTimeout(()=>{ const i=document.getElementById('devCode'); if(i)i.focus(); },50);
 },
 closePanel(){ this.isOpen=false;
   const bg=document.getElementById('devBg'),p=document.getElementById('devPanel');
   if(bg)bg.classList.remove('open'); if(p)p.classList.remove('open'); },
};

/* ---------- init ---------- */
World.gen(); World.bakeGround(); initAtmo();
// a few demo pips for the attract screen
['mossnip','zibbit','puddlefin','frostle'].forEach((sp,i)=>{ const pt=World.spawnPts.meadow[i];
  G.wildPips.push({sp,x:pt[0]*TILE,y:pt[1]*TILE,tx:pt[0]*TILE,ty:pt[1]*TILE,area:'meadow',t:rand(0,9),wt:0,flip:false}); });
Input.init();
DevSys.init();
/* loading a save from a file (works from the title screen or mid-game) */
$('saveFile').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0]; e.target.value=''; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{ const d=SaveSys.parseFile(String(r.result));
    if(!d){ toast('That file is not a Pipgrove save.','warn'); AudioSys.deny(); return; }
    applySave(d); logEvent('Grove loaded from a save file.');
    if(!G.started){ $('title').classList.add('hide'); startGame(false); }
    UI.hud(); UI.objective(); toast('Save file loaded — welcome back!','good'); };
  r.onerror=()=>toast('Could not read that file.','warn');
  r.readAsText(f);
});
const saved=SaveSys.load();
if(saved)applySave(saved); else freshState();
rebuildNpcs();
AudioSys.setVol(G.settings.vol); AudioSys.setMute(G.settings.muted);
showTitle(); UI.hud(); UI.logBadge(); G.dayT=1.25;
addEventListener('beforeunload',()=>{ if(G.started)SaveSys.store(G); });
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&G.started)SaveSys.store(G); });
requestAnimationFrame(loop);
</script>
